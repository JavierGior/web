<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry Potter — Grafo 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1.44.0/dist/force-graph.min.js"></script>
  <style>
    :root {
      --bg: #06080f;
      --panel: rgba(10,14,26,0.86);
      --border: rgba(255,255,255,0.06);
      --border-gold: rgba(200,168,75,0.32);
      --text: #e6dfcf;
      --muted: #8a8578;
      --gold: #c8a84b;
      --gold-d: #a88930;
      --gold-l: #dcc06b;
      --err: #d4324e;
      --font-title: 'Cinzel Decorative', 'Palatino Linotype', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: radial-gradient(ellipse at 50% 30%, #171f38 0%, #0a0d18 55%, #05070d 100%); color: var(--text); font-family: system-ui, sans-serif; overflow: hidden; height: 100vh; }

    /* 3d-force-graph tooltip — transparent wrapper, inner div does the styling */
    .scene-tooltip, .graph-tooltip {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
      color: inherit !important;
    }
    #graph3d, #graph2d { position: fixed; inset: 0; }
    #graph2d { display: none; background: transparent; }
    #sugg { background: #0d0d16; }
    #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    /* View toggle separator inside presetBar */
    #presetBar .sep {
      width: 1px; background: var(--border-gold); opacity: .5; margin: 0 4px;
    }

    /* loading */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      transition: opacity 0.5s ease;
    }
    #loading span { color: var(--muted); font-size: .9rem; }
    .hp-bolt { width: 30px; height: 46px; fill: var(--gold); filter: drop-shadow(0 0 8px rgba(200,168,75,.7)); animation: bolt-pulse 1.4s ease-in-out infinite; }
    @keyframes bolt-pulse { 0%,100% { opacity:1; filter: drop-shadow(0 0 8px rgba(200,168,75,.7)); } 50% { opacity:.5; filter: drop-shadow(0 0 22px rgba(200,168,75,1)); } }

    /* left panel */
    #lp {
      position: fixed; top: 16px; left: 16px; width: 240px;
      background: var(--panel); backdrop-filter: blur(18px);
      border: 1px solid var(--border-gold); border-radius: 14px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.55);
      padding: 16px; z-index: 10; display: flex; flex-direction: column; gap: 12px;
    }
    #lp h2 { font-size: .72rem; font-weight: 400; color: var(--gold); letter-spacing: 1px; font-family: var(--font-title); text-shadow: 0 0 14px rgba(200,168,75,.5); }
    label  { font-size: .78rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type=range] { accent-color: var(--gold); }
    select, input[type=range] {
      width: 100%; background: rgba(0,0,0,.45); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 8px; font-size: .82rem;
    }
    .row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
    .val { color: var(--text); font-weight: 500; }
    .btn {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: .78rem; cursor: pointer; width: 100%;
    }
    .btn:hover { color: var(--text); border-color: var(--gold); }
    .btn.on { color: var(--gold); border-color: var(--gold); background: rgba(200,168,75,.08); }
    /* Grafo: navegación de vistas (viewnav.js) entre el panel de leyenda y la barra de agrupaciones */
    body #viewnav { top: 16px; bottom: auto; left: 272px; }
    /* Chat del Grafo: ~37% más angosto que el espacio libre a la derecha de la barra */
    body #cp { width: clamp(290px, calc(0.63 * (100vw - 940px)), 454px); }
    #presetBar {
      position: fixed; top: 16px; left: max(50%, 787px); transform: translateX(-50%);   /* centrada; corrida si no entra al lado de la navegación (termina en x=515) */
      max-width: calc(2 * (100vw - 819px - clamp(290px, calc(0.63 * (100vw - 940px)), 454px)));   /* pantallas angostas: 2 filas antes que pisar el chat */
      z-index: 12; flex-wrap: wrap;
      background: var(--panel); backdrop-filter: blur(18px);
      border: 1px solid var(--border-gold); border-radius: 12px;
      padding: 8px; display: flex; gap: 4px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.55);
    }
    #presetBar .btn {
      width: auto; padding: 6px 8px; font-size: .76rem;
      font-family: var(--font-title); letter-spacing: .5px;
    }
    .legend { display: flex; flex-direction: column; gap: 5px; }
    .li { display: flex; align-items: center; gap: 7px; font-size: .75rem; color: var(--muted); cursor: pointer; transition: opacity .2s; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .li .expand-btn {
      margin-left: 4px; padding: 0 5px;
      background: transparent; border: 1px solid var(--border);
      border-radius: 4px; color: var(--muted); cursor: pointer;
      font-size: .7rem; font-weight: 600; line-height: 1.2;
      transition: all .15s;
    }
    .li .expand-btn:hover { color: var(--gold); border-color: var(--gold); }
    .li .expand-btn.on {
      color: var(--bg); background: var(--gold); border-color: var(--gold);
    }

    /* chat panel */
    #cp {
      position: fixed; top: 16px; right: 16px; width: 400px;
      max-height: calc(100vh - 32px);
      background: rgba(4,4,12,0.52); backdrop-filter: blur(22px);
      border: 1px solid var(--border-gold); border-radius: 14px;
      padding: 18px; z-index: 10; display: flex; flex-direction: column; gap: 10px;
    }
    #cp h2 { font-size: .72rem; font-weight: 400; color: var(--gold); font-family: var(--font-title); letter-spacing: 1px; text-shadow: 0 0 14px rgba(200,168,75,.5); }
    #hist {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      gap: 10px; max-height: 440px;
      scrollbar-width: thin; scrollbar-color: rgba(200,168,75,.3) transparent;
    }
    .q { font-size: .78rem; color: var(--muted); background: rgba(200,168,75,.07); border-left: 2px solid var(--gold); padding: 7px 10px; border-radius: 4px; }
    .a { font-size: .83rem; line-height: 1.55; }
    .a.streaming::after { content:'▋'; animation: blink .8s step-end infinite; }
    @keyframes blink { 50%{opacity:0} }
    #ci {
      width: 100%; min-height: 64px; padding: 9px 11px;
      background: rgba(0,0,0,.38); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: .85rem; resize: none;
    }
    #ci:focus { outline: none; border-color: var(--gold); }
    #cs {
      background: var(--gold); color: var(--bg); border: none;
      border-radius: 8px; padding: 9px; font-weight: 600; cursor: pointer;
      font-size: .85rem; width: 100%;
    }
    #cs:hover { background: var(--gold-d); }
    #cs:disabled { opacity: .5; cursor: not-allowed; }
    #fl { font-size: .75rem; color: var(--muted); min-height: 1em; }

    .elink {
      color: var(--gold); cursor: pointer;
      border-bottom: 1px solid rgba(200,168,75,.35);
      transition: border-color .15s;
    }
    .elink:hover { border-bottom-color: var(--gold); }

    /* 2D: mismo fondo que el 3D (#050508) + estrellas estáticas. Antes era un tema claro aparte. */
    #graph2d {
      background-color: #050508;
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.45), transparent),
        radial-gradient(1.5px 1.5px at 200px 150px, rgba(245,227,163,.6), transparent),
        radial-gradient(1px 1px at 300px 220px, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 60px 260px, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 340px 40px, rgba(255,255,255,.5), transparent);
      background-size: 360px 300px;
    }
    /* Celular: navegación y agrupaciones arriba, leyenda plegable, chat abajo (ver chat-panel.js) */
    @media (max-width: 768px) {
      body #viewnav { left: 8px; top: 8px; }
      #presetBar { top: 56px; left: 8px; right: 8px; transform: none; max-width: none;
        flex-wrap: nowrap; overflow-x: auto; padding: 6px; }
      #presetBar .btn { flex: 0 0 auto; }
      #lp { top: 112px; left: 8px; width: min(240px, calc(100vw - 16px)); max-height: calc(100vh - 400px); overflow-y: auto; }
      #lp h2 { cursor: pointer; }
      #lp h2::after { content: ' ▾'; }
      #lp.collapsed h2::after { content: ' ▸'; }
      #lp.collapsed > *:not(h2) { display: none; }
      body #cp { width: auto; }
    }
  </style>
  <script src="config.js?v=6ee3deb9"></script>
  <script src="wakeup.js?v=dd83b694"></script>
</head>
<body>
  <div id="loading"><svg class="hp-bolt" viewBox="0 0 30 46" xmlns="http://www.w3.org/2000/svg"><path d="M22,2 L7,24 L17,24 L10,44 L24,22 L14,22 Z"/></svg><span id="ls">Cargando el Mapa del Merodeador…</span></div>
  <div id="graph3d"></div>
  <div id="graph2d"></div>
  <canvas id="fxCanvas"></canvas>

  <div id="presetBar">
    <button class="btn preset-btn on" data-preset="all">Todo</button>
    <button class="btn preset-btn" data-preset="casas">Casas</button>
    <button class="btn preset-btn" data-preset="familias">Familias</button>
    <button class="btn preset-btn" data-preset="bandos">Bandos</button>
    <button class="btn preset-btn" data-preset="comunidades">Comunidades</button>
    <div class="sep"></div>
    <button class="btn view-btn on" data-view="3d">3D</button>
    <button class="btn view-btn" data-view="2d">2D</button>
  </div>

  <div id="lp">
    <h2>Grafo de Harry Potter</h2>
    <!-- Solo el grafo canónico: las entidades por libro no tienen métricas (pagerank) y el grafo por libro
         salía vacío. El select queda oculto porque load() lee su valor. -->
    <div hidden>
      <select id="sel"><option value="hp">Canónico — los 7 libros</option></select>
    </div>
    <div>
      <label>Grados de separación: <span id="hl">1</span></label>
      <input type="range" id="hr" min="1" max="3" value="1">
    </div>
    <div style="position:relative">
      <label>Buscar nodo</label>
      <input type="text" id="search" placeholder="Nombre del personaje…" autocomplete="off"
        style="width:100%;background:rgba(0,0,0,.45);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:.82rem;">
      <div id="sugg" style="display:none;position:absolute;top:100%;left:0;right:0;border:1px solid var(--border);border-radius:0 0 6px 6px;max-height:140px;overflow-y:auto;z-index:20;"></div>
    </div>
    <button class="btn" id="gb">Mostrar grafo completo</button>
    <div>
      <div class="row"><span>Nodos</span><span class="val" id="sn">—</span></div>
      <div class="row"><span>Vínculos</span><span class="val" id="sl">—</span></div>
      <div class="row" id="sfr" style="display:none"><span>Foco</span><span class="val" id="sf">—</span></div>
    </div>
    <div><label>Tipos de entidades</label><div class="legend" id="leg"></div></div>
  </div>

  <div id="cp">
    <h2>Preguntá sobre el corpus</h2>
    <div id="fl">Hacé clic en un nodo para enfocarlo</div>
    <div id="hist"></div>
    <textarea id="ci" maxlength="500" placeholder="Preguntá sobre este personaje..." rows="3"></textarea>
    <button id="cs">Preguntar</button>
  </div>


  <script>
    const HC = { Gryffindor:'#c4583d', Slytherin:'#2e8b57', Ravenclaw:'#2f63b0', Hufflepuff:'#d9b13b', Unknown:'#9988bb' };
    // Segundo color de cada casa (teja+oro apagado, verde+plata, azul+bronce, amarillo+negro cálido): anillo interno del tooltip
    const HC2 = { Gryffindor:'#c9a44a', Slytherin:'#a9b1b8', Ravenclaw:'#a7794a', Hufflepuff:'#5a4f3c' };
    // Preset palettes — vibrant/saturated to contrast against the type palette
    // wiki_house comes lowercased from Neo4j; keys must match
    const HOUSE_PRESET = {
      gryffindor: { color:'#c4583d', label:'Gryffindor' },
      slytherin:  { color:'#2e8b57', label:'Slytherin' },
      ravenclaw:  { color:'#2f63b0', label:'Ravenclaw' },
      hufflepuff: { color:'#d9b13b', label:'Hufflepuff' },
    };
    function houseKey(n) {
      const v = n.wiki_house;
      if (typeof v !== 'string') return null;
      const k = v.toLowerCase();
      return HOUSE_PRESET[k] ? k : null;
    }
    const TOP_FAMILIES = {
      'weasley family':    { key:'weasley',    color:'#ff7a1a', label:'Weasley' },
      'potter family':     { key:'potter',     color:'#ff2b1c', label:'Potter' },
      'black family':      { key:'black',      color:'#c8c8c8', label:'Black' },
      'prewett family':    { key:'prewett',    color:'#ff2fbe', label:'Prewett' },
      'dursley family':    { key:'dursley',    color:'#c68a4b', label:'Dursley' },
      'longbottom family': { key:'longbottom', color:'#4ade80', label:'Longbottom' },
      'malfoy family':     { key:'malfoy',     color:'#7ec8e3', label:'Malfoy' },
    };
    const FACTION_COLORS = {
      'death eaters':          { color:'#8b1de8', label:'Mortífagos' },
      'order of the phoenix':  { color:'#ffd400', label:'Orden del Fénix' },
    };
    // Top-6 comunidades Louvain sobre la co-ocurrencia (etl/build_coocurrencia.py, ordenadas por menciones).
    const TOP_COMMS_ARR = [0, 1, 2, 3, 4, 5];
    const TOP_COMMS = new Set(TOP_COMMS_ARR);
    const COMM_COLORS = ['#2a7dff', '#8b1de8', '#ff7a1a', '#ffd400', '#4ade80', '#c8c8c8'];
    const COMM_LABELS = [
      'Vida en Hogwarts',             // c=0: Ron, Hermione, Snape, Draco, McGonagall, Neville, las casas
      'La guerra contra Voldemort',   // c=1: Harry, Dumbledore, Voldemort, Ministerio, Mortífagos, Azkaban
      'Los Weasley y la Orden',       // c=2: Sirius, Fred, George, Ginny, Arthur, Molly, Lupin, Moody
      'Torneo de los Tres Magos',     // c=3: Cedric, Fleur, Krum, Bagman, Maxime, Mundial de Quidditch
      'Hagrid y el Bosque Prohibido', // c=4: Hagrid, Buckbeak, Fang, Grawp, terrenos del castillo
      'Los Dursley y el mundo muggle', // c=5: Vernon, Dudley, Petunia, Privet Drive, Londres
    ];
    const PRESETS = {
      all:         { label:'Todo' },
      casas:       { label:'Casas' },
      familias:    { label:'Familias' },
      bandos:      { label:'Bandos' },
      comunidades: { label:'Comunidades' },
    };
    let preset = 'all';
    let hiddenPresetCats = new Set();    // category keys hidden within current non-'all' preset
    let expandedPresetCats = new Set();  // familias preset only: keys whose maiden/loyalty matches are included
    const TYPES = {
      person:       { color: '#d4324e', label: 'Persona' },
      place:        { color: '#3ba171', label: 'Lugar' },
      spell:        { color: '#f2c740', label: 'Hechizo' },
      organization: { color: '#4880c8', label: 'Organización' },
      object:       { color: '#a06fd8', label: 'Objeto' },
      event:        { color: '#e88240', label: 'Evento' },
      concept:      { color: '#7bbf7b', label: 'Concepto' },
      unknown:      { color: '#c8b598', label: 'Otro' },
    };
    const ROLES = {
      'Harry Potter':        'El niño que sobrevivió — Protagonista',
      'Ron Weasley':         'Mejor amigo de Harry — Trío',
      'Hermione Granger':    'Bruja brillante — Trío',
      'Albus Dumbledore':    'Director de Hogwarts — Mentor',
      'Lord Voldemort':      'Lord Tenebroso — Antagonista',
      'Severus Snape':       'Maestro de Pociones — Doble agente',
      'Rubeus Hagrid':       'Guardabosques — Amigo leal',
      'Minerva McGonagall':  'Profesora de Transformaciones — Subdirectora',
      'Sirius Black':        'Padrino de Harry — Merodeador',
      'Remus Lupin':         'Profesor de DADA — Merodeador',
      'Draco Malfoy':        'Rival Slytherin',
      'Neville Longbottom':  'Compañero de Harry — Herbólogo',
      'Ginny Weasley':       'Weasley — amor de Harry',
      'Luna Lovegood':       'Excéntrica amiga Ravenclaw',
      'Fred Weasley':        'Gemelo Weasley — Bromista',
      'George Weasley':      'Gemelo Weasley — Bromista',
      'Bellatrix Lestrange': 'Mortífaga — leal a Voldemort',
      'Dolores Umbridge':    'Funcionaria del Ministerio — Villana',
      'Cedric Diggory':      'Campeón del Torneo de los Tres Magos',
      'Cho Chang':           'Primer amor de Harry',
      'Nymphadora Tonks':    'Auror — Metamorfomaga',
      'Peter Pettigrew':     'Merodeador — Traidor',
      'James Potter':        'Padre de Harry — Merodeador',
      'Lily Potter':         'Madre de Harry',
      'Molly Weasley':       'Matriarca Weasley',
      'Arthur Weasley':      'Empleado del Ministerio — Patriarca Weasley',
      'Bill Weasley':        'Rompe-maldiciones — Mayor de los Weasley',
      'Charlie Weasley':     'Cuidador de dragones en Rumania',
      'Percy Weasley':       'Funcionario del Ministerio',
      'Fleur Delacour':      'Campeona de Beauxbatons',
      'Viktor Krum':         'Estrella de Quidditch de Durmstrang',
      'Lucius Malfoy':       'Mortífago — padre de Draco',
      'Narcissa Malfoy':     'Madre de Draco',
      'Alastor Moody':       'Auror legendario',
      'Filius Flitwick':     'Profesor de Encantamientos',
      'Pomona Sprout':       'Profesora de Herbología',
      'Horace Slughorn':     'Profesor de Pociones',
      'Gilderoy Lockhart':   'Profesor de DADA fraudulento',
      'Quirinus Quirrell':   'Profesor de DADA — huésped de Voldemort',
      'Argus Filch':         'Conserje de Hogwarts',
      'Sybill Trelawney':    'Profesora de Adivinación',
      'Fenrir Greyback':     'Hombre lobo — Mortífago',
      'Dobby':               'Elfo doméstico libre',
      'Kreacher':            'Elfo doméstico de la familia Black',
      'Hedwig':              'Lechuza nívea de Harry',
    };
    const HM = {
      'Harry Potter':'Gryffindor','Hermione Granger':'Gryffindor','Ron Weasley':'Gryffindor',
      'Albus Dumbledore':'Gryffindor','Neville Longbottom':'Gryffindor','Ginny Weasley':'Gryffindor',
      'Rubeus Hagrid':'Gryffindor','Minerva McGonagall':'Gryffindor','Sirius Black':'Gryffindor',
      'James Potter':'Gryffindor','Lily Potter':'Gryffindor','Remus Lupin':'Gryffindor',
      'Fred Weasley':'Gryffindor','George Weasley':'Gryffindor',
      'Draco Malfoy':'Slytherin','Lord Voldemort':'Slytherin','Tom Riddle':'Slytherin',
      'Severus Snape':'Slytherin','Bellatrix Lestrange':'Slytherin','Lucius Malfoy':'Slytherin',
      'Luna Lovegood':'Ravenclaw','Cho Chang':'Ravenclaw','Filius Flitwick':'Ravenclaw',
      'Cedric Diggory':'Hufflepuff','Nymphadora Tonks':'Hufflepuff','Pomona Sprout':'Hufflepuff',
    };

    function house(n) { return n.house || HM[n.name] || 'Unknown'; }
    function hasLoyalty(n, target) {
      return Array.isArray(n.wiki_loyalty) && n.wiki_loyalty.some(x => String(x).toLowerCase() === target);
    }
    // Surname → family key. Uses displayed surname (not wiki_loyalty) so people
    // classify by legal/displayed name: Molly Weasley = weasley (not prewett birth),
    // Hermione Granger = null (Granger isn't a top family, not in Weasley cluster
    // by association).
    const FAMILY_BY_SURNAME = {
      weasley: 'weasley', potter: 'potter', black: 'black',
      prewett: 'prewett', dursley: 'dursley',
      longbottom: 'longbottom', malfoy: 'malfoy',
    };
    function getFamilyKey(n) {
      if (!n.name || n.type !== 'person') return null;
      const parts = String(n.name).trim().split(/\s+/);
      const surname = parts[parts.length - 1].toLowerCase();
      return FAMILY_BY_SURNAME[surname] || null;
    }
    // All top-family memberships of a node (surname + wiki_loyalty).
    // Used for tooltip enrichment (A) and for expanded family view (C).
    function getFamilyMemberships(n) {
      const set = new Set();
      const primary = getFamilyKey(n);
      if (primary) set.add(primary);
      if (Array.isArray(n.wiki_loyalty)) {
        for (const l of n.wiki_loyalty) {
          const low = String(l).toLowerCase();
          if (TOP_FAMILIES[low]) set.add(TOP_FAMILIES[low].key);
        }
      }
      return [...set];
    }
    // Single-family cluster assignment for the Familias preset. Priority:
    //   1) surname (getFamilyKey) if that family is not hidden
    //   2) any expanded family key matched via wiki_loyalty
    // Returns null if node belongs to no active family. Ensures each node
    // lives in ONE cluster (color, physics, legend all consistent).
    function familyClusterOf(n) {
      const primary = getFamilyKey(n);
      if (primary && !hiddenPresetCats.has(primary)) return primary;
      if (expandedPresetCats.size === 0) return null;
      const memberships = getFamilyMemberships(n);
      for (const ek of expandedPresetCats) {
        if (hiddenPresetCats.has(ek)) continue;
        if (memberships.includes(ek)) return ek;
      }
      return null;
    }
    function presetVisible(n) {
      switch (preset) {
        case 'all':         return true;
        case 'casas': {
          const k = houseKey(n);
          return k !== null && !hiddenPresetCats.has(k);
        }

    (function addStarField(scene) {
      const layers = [
        { count: 2000, size: 1.8, opacity: 0.275, minR:  800, maxR: 2500 },  // near

    function buildAdj(ns, ls) {

    }
    function bfs(id, hops) {
      // Source-relative pruning: at each expansion, keep neighbors whose pagerank

      // characters; Harry (high PR) → main characters. Focus-specific ego graphs.
      const sourcePR = nmap[id]?.pagerank || 0;
      const CAP = 18;
      const d = {[id]:0}, q = [id];
      while (q.length) {
        const c = q.shift(); if (d[c] >= hops) continue;
        let nbs = Array.from(adj[c] || []);
        if (nbs.length > CAP) {
          nbs.sort((a, b) => {
            const dA = Math.abs((nmap[a]?.pagerank || 0) - sourcePR);
            const dB = Math.abs((nmap[b]?.pagerank || 0) - sourcePR);
            return dA - dB;
          });
          nbs = nbs.slice(0, CAP);

          if (d[nb] === undefined) { d[nb] = d[c] + 1; q.push(nb); }
        }

    // Preset-aware cap. Full API returns 1150 nodes; keep visible set bounded so

    const CAP_TYPE = {

      object: 15, concept: 10, event: 10, unknown: 5,
    };
    function capPresetNodes(ns, maxTotal = 200) {
      if (ns.length <= maxTotal) return ns;

      if (preset === 'all') {
        for (const n of ns) {
          const key = n.type || 'unknown';
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(n);
        }
        const out = [];
        for (const [key, nodes] of buckets) {
          const cap = CAP_TYPE[key] ?? 10;
          nodes.sort((a, b) => (b.pagerank || 0) - (a.pagerank || 0));
          for (let i = 0; i < Math.min(cap, nodes.length); i++) out.push(nodes[i]);
        }
        return out;
      }
      // Non-'all': bucket by preset category, evenly distribute cap
      const cats = presetCategories();
      for (const n of ns) {
        for (const c of cats) {
          if (c.matches(n)) {
            if (!buckets.has(c.key)) buckets.set(c.key, []);
            buckets.get(c.key).push(n);
            break;
          }
        }
      }
      if (buckets.size === 0) return ns.slice(0, maxTotal);
      const perCat = Math.max(15, Math.floor(maxTotal / buckets.size));
      const out = [];
      for (const nodes of buckets.values()) {
        nodes.sort((a, b) => (b.pagerank || 0) - (a.pagerank || 0));
        for (let i = 0; i < Math.min(perCat, nodes.length); i++) out.push(nodes[i]);
      }
      return out;
    }

    function applyView() {
      const base = egoVis
        ? allN.filter(n => egoVis.has(n.id))
        : allN;
      // `hidden` (entity-type filter) is only meaningful for preset='all', where the legend
      // exposes entity-type toggles. Non-'all' presets have different legend categories
      // (families, houses, factions, communities) and would leave the user with no UI to
      // un-hide types. Ignore `hidden` in those presets — it persists silently and re-applies
      // when the user returns to 'all'.
      const typeFilter = preset === 'all'
        ? (n => !hidden.has(n.type || 'unknown'))
        : (() => true);
      let ns = base.filter(n => typeFilter(n) && presetVisible(n));
      // Preset-aware cap: full API mode returns all 1150 entities, we bound the visible
      // set here so physics + rendering stay smooth. Skip when ego is active (already narrow).
      if (!egoVis) ns = capPresetNodes(ns);
      const ids = new Set(ns.map(n => n.id));
      // Rebuild fresh link objects with STRING source/target every call.
      // Force-graph mutates source/target to Node references after graphData(),
      // so reusing mutated links across calls breaks when node subsets change.
      // Todos los VINCULO están verificados: weight 1 = sin dato de co-aparición, no ruido. No se filtran.
      const WEAK_FLOOR = 0;
      const ls = [];
      for (const l of allL) {
        const s = l.source && typeof l.source === 'object' ? l.source.id : l.source;
        const t = l.target && typeof l.target === 'object' ? l.target.id : l.target;
        const w = l.weight || 0;
        if (ids.has(s) && ids.has(t) && w > WEAK_FLOOR) {
          ls.push({ source: s, target: t, type: l.type, description: l.description, weight: w });
        }
      }
      // Preset-tier annotation using edge weight percentiles.
      // Tier 1 = intra-cluster AND strong (top ~33%)
      // Tier 2 = intra-cluster XOR strong
      // Tier 3 = cross-cluster AND weak (bottom ~33%)
      if (preset !== 'all' && ls.length) {
        const sortedW = ls.map(l => l.weight).sort((a, b) => a - b);
        const p66 = sortedW[Math.floor(sortedW.length * 0.66)] || 0;
        const cats = presetCategories();
        const catCache = new Map();
        const catOf = (nodeId) => {
          if (catCache.has(nodeId)) return catCache.get(nodeId);
          const n = nmap[nodeId]; let key = null;
          if (n) for (const c of cats) if (c.matches(n)) { key = c.key; break; }
          catCache.set(nodeId, key);
          return key;
        };
        for (const l of ls) {
          const cs = catOf(l.source), ct = catOf(l.target);
          const sameCluster = cs && ct && cs === ct;
          const isStrong = l.weight >= p66;
          l.tier = (sameCluster && isStrong) ? 1 : (sameCluster || isStrong) ? 2 : 3;
        }
      }
      activeG().graphData({nodes: ns, links: ls});
      if (mode === '3d') setTimeout(refreshMaterials, 50);
      stats(ns.length, ls.length);
      updateLegendCounts(ns);
    }

    function egoGraph(id, hops) {
      distMap = bfs(id, hops);
      maxDist = Object.values(distMap).reduce((m, v) => v > m ? v : m, 0);
      egoVis = new Set(Object.keys(distMap));
      applyView();
      document.getElementById('gb').classList.add('on');
    }
    function fullGraph() {
      focus = null;
      distMap = {};
      maxDist = 0;
      egoVis = null;
      document.getElementById('fl').textContent = 'Hacé clic en un nodo para enfocarlo';
      document.getElementById('sfr').style.display = 'none';
      document.getElementById('gb').classList.remove('on');
      document.getElementById('ci').placeholder = 'Preguntá sobre este personaje...';
      applyView();
    }
    function refreshNodeColors() {
      if (mode === '3d') {
        // Update THREE materials in place — preset changed but node refs are the same
        allN.forEach(n => {
          const mat = matMap[n.id];
          const glow = glowMatMap[n.id];
          if (!mat) return;
          const hex = hexToInt(baseColor(n));
          mat.color.setHex(hex);
          if (glow) glow.color.setHex(hex);
        });
      } else if (G2) {
        // Canvas 2D: reassign accessor to trigger re-render
        G2.nodeColor(n => baseColor(n));
      }
    }
    function switchPreset(name) {
      if (!PRESETS[name]) return;
      preset = name;
      hiddenPresetCats.clear();     // fresh visibility state per preset
      expandedPresetCats.clear();   // fresh expansion state per preset
      // Exit ego mode — presets are a distinct experience
      focus = null;
      distMap = {};
      maxDist = 0;
      egoVis = null;
      hoverLink = null;
      document.getElementById('gb').classList.remove('on');
      document.getElementById('sfr').style.display = 'none';
      document.getElementById('fl').textContent =
        name === 'all' ? 'Hacé clic en un nodo para enfocarlo' : 'Preset: ' + PRESETS[name].label;
      document.getElementById('ci').placeholder = 'Preguntá sobre este personaje...';
      // Toggle button visual state
      document.querySelectorAll('.preset-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.preset === name);
      });
      buildLegend();
      applyView();
      refreshNodeColors();
      // Reset camera after physics has a chance to reorganize
      activeG().d3ReheatSimulation();
      setTimeout(() => activeG().zoomToFit(800, 60), 400);
    }
    function stats(n, l) {
      document.getElementById('sn').textContent = n.toLocaleString();
      document.getElementById('sl').textContent = l.toLocaleString();
    }
    // ─────  Preset-aware physics: link distance + cluster attraction  ─────
    // Same-category links pull tighter; different-category use base distance.
    function linkDistance(l) {
      const base    = mode === '3d' ? 200 : 60;
      const sameCat = mode === '3d' ? 90  : 28;
      if (preset === 'all') return base;
      const s = typeof l.source === 'object' ? l.source : nmap[l.source];
      const t = typeof l.target === 'object' ? l.target : nmap[l.target];
      if (!s || !t) return base;
      const cats = presetCategories();
      let ks = null, kt = null;
      for (const c of cats) {
        if (!ks && c.matches(s)) ks = c.key;
        if (!kt && c.matches(t)) kt = c.key;
        if (ks && kt) break;
      }
      return (ks && kt && ks === kt) ? sameCat : base;
    }

    // Custom d3-force: pulls each node toward the centroid of its preset category.
    // Factory pattern so G3 and G2 each get their own instance with their own nodes ref.
    // Atrae suavemente a quienes comparten muchos pasajes (score coseno). No dibuja nada: solo ubica.
    function makeCoocForce() {
      let byId = new Map();
      function force(alpha) {
        const k = 0.04 * alpha;
        for (const c of allC) {
          const a = byId.get(c.source), b = byId.get(c.target);
          if (!a || !b) continue;
          const w = k * c.score;
          const dx = (b.x - a.x) * w, dy = (b.y - a.y) * w, dz = ((b.z || 0) - (a.z || 0)) * w;
          a.vx += dx; a.vy += dy; b.vx -= dx; b.vy -= dy;
          if (a.z !== undefined) { a.vz += dz; b.vz -= dz; }
        }
      }
      force.initialize = ns => { byId = new Map(ns.map(n => [n.id, n])); };
      return force;
    }
    function makeClusterForce() {
      let nodes = null;
      function force(alpha) {
        if (preset === 'all' || !nodes || nodes.length === 0) return;
        const cats = presetCategories();
        // Bucket each node by category (skip nodes with no category = shouldn't happen post-filter)
        const catOf = new Map();
        for (const n of nodes) {
          for (const c of cats) {
            if (c.matches(n)) { catOf.set(n, c.key); break; }
          }
        }
        // Compute centroids per category
        const centroids = {};
        for (const n of nodes) {
          const k = catOf.get(n); if (!k) continue;
          if (!centroids[k]) centroids[k] = { x:0, y:0, z:0, n:0 };
          centroids[k].x += n.x || 0;
          centroids[k].y += n.y || 0;
          centroids[k].z += n.z || 0;
          centroids[k].n++;
        }
        for (const c of Object.values(centroids)) {
          if (c.n) { c.x /= c.n; c.y /= c.n; c.z /= c.n; }
        }
        // Apply attraction toward category centroid
        const strength = 0.35 * alpha;
        for (const n of nodes) {
          const k = catOf.get(n); if (!k) continue;
          const c = centroids[k]; if (!c) continue;
          n.vx = (n.vx || 0) + (c.x - (n.x || 0)) * strength;
          n.vy = (n.vy || 0) + (c.y - (n.y || 0)) * strength;
          if (n.z !== undefined) n.vz = (n.vz || 0) + (c.z - (n.z || 0)) * strength;
        }
      }
      force.initialize = function(_nodes) { nodes = _nodes; };
      return force;
    }

    // Category descriptor per preset: {key, color, label, matches(node)}
    function presetCategories() {
      if (preset === 'casas') {
        return ['gryffindor','slytherin','ravenclaw','hufflepuff'].map(h => ({
          key: h, color: HOUSE_PRESET[h].color, label: HOUSE_PRESET[h].label,
          matches: n => houseKey(n) === h,
        }));
      }
      if (preset === 'familias') {
        return Object.values(TOP_FAMILIES).map(f => ({
          key: f.key, color: f.color, label: f.label,
          // Single-cluster assignment (surname primary, expansion fallback)
          matches: n => familyClusterOf(n) === f.key,
        }));
      }
      if (preset === 'bandos') {
        return [
          { key:'de',    color: FACTION_COLORS['death eaters'].color,        label:'Mortífagos',
            matches: n => hasLoyalty(n, 'death eaters') },
          { key:'orden', color: FACTION_COLORS['order of the phoenix'].color, label:'Orden del Fénix',
            matches: n => hasLoyalty(n, 'order of the phoenix') },
        ];
      }
      if (preset === 'comunidades') {
        return TOP_COMMS_ARR.map((c, i) => ({
          key: 'c'+c, color: COMM_COLORS[i], label: COMM_LABELS[i],
          matches: n => n.community === c,
        }));
      }
      // 'all' → the 8 entity types (with hide toggle)
      return Object.entries(TYPES).map(([t, { color, label }]) => ({
        key: t, color, label,
        matches: n => (n.type || 'unknown') === t,
        toggleable: true,
      }));
    }

    function updateLegendCounts(nodes) {
      const cats = presetCategories();
      const items = document.querySelectorAll('#leg .li');
      cats.forEach((cat, i) => {
        const el = items[i]; if (!el) return;
        const cnt = (nodes || []).reduce((a, n) => a + (cat.matches(n) ? 1 : 0), 0);
        const spans = el.querySelectorAll('span');
        const countSpan = spans[spans.length - 1];
        if (countSpan) countSpan.textContent = cnt;
      });
    }

    function buildLegend() {
      const leg = document.getElementById('leg');
      leg.innerHTML = '';
      const cats = presetCategories();
      cats.forEach(cat => {
        const el = document.createElement('div');
        el.className = 'li';
        el.dataset.key = cat.key;
        const cnt = (allN || []).reduce((a, n) => a + (cat.matches(n) ? 1 : 0), 0);
        el.innerHTML =
          '<div class="dot" style="background:'+cat.color+';box-shadow:0 0 5px '+cat.color+'99"></div>' +
          '<span>'+cat.label+'</span>' +
          '<span style="margin-left:auto;color:var(--muted);font-size:.7rem;font-variant-numeric:tabular-nums">'+cnt+'</span>';
        if (cat.toggleable) {
          // 'all' preset — uses `hidden` (Set of type strings) and load(singleType) API mode
          if (hidden.has(cat.key)) el.style.opacity = '.3';
          el.onclick = () => {
            const wasHidden = hidden.has(cat.key);
            if (wasHidden) {
              hidden.delete(cat.key); el.style.opacity = '1';
              if (currentLoadType) { currentLoadType = null; load(); return; }
              applyView();
            } else {
              hidden.add(cat.key); el.style.opacity = '.3';
              const visible = Object.keys(TYPES).filter(x => !hidden.has(x));
              if (visible.length === 1) {
                load(visible[0]);
              } else {
                applyView();
              }
            }
          };
        } else {
          // Other presets — row click toggles hidden. Familias preset also gets a "+" button
          // that expands the category to include maiden-name / loyalty matches.
          if (hiddenPresetCats.has(cat.key)) el.style.opacity = '.3';
          if (preset === 'familias') {
            const btn = document.createElement('button');
            const isExpanded = expandedPresetCats.has(cat.key);
            btn.className = 'expand-btn' + (isExpanded ? ' on' : '');
            if (isExpanded) {
              const primary = (allN || []).filter(n => getFamilyKey(n) === cat.key).length;
              const total   = (allN || []).filter(n => familyClusterOf(n) === cat.key).length;
              const delta   = total - primary;
              btn.textContent = delta > 0 ? `+${delta}` : '+';
            } else {
              btn.textContent = '+';
            }
            btn.title = 'Incluir nodos con este apellido en wiki loyalty (nacimiento/matrimonio)';
            btn.onclick = (e) => {
              e.stopPropagation();
              if (expandedPresetCats.has(cat.key)) expandedPresetCats.delete(cat.key);
              else expandedPresetCats.add(cat.key);
              buildLegend();
              applyView();
              refreshNodeColors();
            };
            el.appendChild(btn);
          }
          el.onclick = () => {
            if (hiddenPresetCats.has(cat.key)) {
              hiddenPresetCats.delete(cat.key);
              el.style.opacity = '1';
            } else {
              hiddenPresetCats.add(cat.key);
              el.style.opacity = '.3';
            }
            applyView();
          };
        }
        leg.appendChild(el);
      });
    }

    function linkifyEntities(text) {
      // Nombre en inglés y en español (el chat responde "Mortífagos"): texto -> id del nodo
      const names = allN.flatMap(n => [[n.name, n.id]].concat(n.label && n.label !== n.name ? [[n.label, n.id]] : []))
        .sort((a, b) => b[0].length - a[0].length);
      const placeholders = [];
      let result = text;
      for (const [name, id] of names) {
        const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp('(?<![\\wÀ-ÿ])' + esc + '(?![\\wÀ-ÿ])', 'g');
        if (re.test(result)) {
          const idx = placeholders.length;
          result = result.replace(re, '\x00' + idx + '\x00');
          placeholders.push([name, id]);
        }
      }
      // Escape LLM text before injecting HTML (placeholders \x00N\x00 survive escaping)
      const h = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      result = h(result).replace(/\n/g, '<br>');
      placeholders.forEach(([name, id], i) => {
        const safe = h(id.replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        result = result.split('\x00' + i + '\x00').join(
          '<span class="elink" onclick="focusNode(nmap[\'' + safe + '\'])">' + h(name) + '</span>'
        );
      });
      return result;
    }

    async function load(singleType) {
      const src = document.getElementById('sel').value;
      const ls = document.getElementById('ls');
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading').style.opacity = '1';
      ls.textContent = singleType ? `Invocando ${singleType}s…` : 'Consultando el mapa…';
      document.getElementById('sn').textContent = '…';
      document.getElementById('sl').textContent = '…';
      try {
        const url = singleType
          ? `/api/graph/${src}?type=${encodeURIComponent(singleType)}&limit=200`
          : `/api/graph/${src}?full=true`;
        const d = await fetch(apiUrl(url)).then(r => r.json());
        allN = d.nodes || []; allL = d.links || []; allC = d.cooc || [];
        coocOf = {};
        allC.forEach(c => { (coocOf[c.source] ||= []).push(c); (coocOf[c.target] ||= []).push(c); });
        Object.values(coocOf).forEach(l => l.sort((a, b) => b.pasajes - a.pasajes));
        buildAdj(allN, allL);
        buildLegend();
        currentLoadType = singleType || null;

        const top = allN.reduce((a, b) => ((b.pagerank||0) > (a.pagerank||0) ? b : a), allN[0]);

        if (top && !singleType) {
          // Prepare everything BEFORE reveal: focus, ego, UI, camera
          focus = top;
          const counts = [1, 2, 3].map(h => Object.keys(bfs(top.id, h)).length);
          let maxUseful = 1;
          for (let i = 1; i < counts.length; i++) if (counts[i] > counts[i-1]) maxUseful = i + 1;
          const slider = document.getElementById('hr');
          slider.max = maxUseful;
          slider.value = 1;
          document.getElementById('hl').textContent = 1;
          egoGraph(top.id, 1);  // triggers G.graphData with ego subset
          document.getElementById('fl').textContent = 'Foco: ' + top.name;
          document.getElementById('sf').textContent = top.name;
          document.getElementById('sfr').style.display = '';
          document.getElementById('ci').placeholder = 'Preguntá sobre "' + top.name + '"…';
          ls.textContent = 'El mapa revela sus secretos…';

          // Physics runs "underneath" — reveal only when settled and camera positioned
          setTimeout(() => {
            flyTo(top, 0, 600);  // instant camera, wide initial context
            const load = document.getElementById('loading');
            load.style.opacity = '0';
            setTimeout(() => { load.style.display = 'none'; }, 500);
          }, 1800);
        } else {
          egoVis = null; distMap = {};
          applyView();
          document.getElementById('sfr').style.display = 'none';
          document.getElementById('gb').classList.remove('on');
          const load = document.getElementById('loading');
          load.style.opacity = '0';
          setTimeout(() => { load.style.display = 'none'; }, 500);
        }
      } catch(e) {
        ls.textContent = 'Error: ' + e.message;
        console.error(e);
      }
    }

    // Magic wand particle trail
    (function initFx() {
      const cv = document.getElementById('fxCanvas');
      const ctx = cv.getContext('2d');
      const resize = () => { cv.width = window.innerWidth; cv.height = window.innerHeight; };
      resize();
      window.addEventListener('resize', resize);
      const parts = [];
      let lx = -1, ly = -1;
      document.getElementById('graph3d').addEventListener('mousemove', e => {
        const dx = lx < 0 ? 0 : e.clientX - lx;
        const dy = ly < 0 ? 0 : e.clientY - ly;
        const sp = Math.hypot(dx, dy);
        lx = e.clientX; ly = e.clientY;
        if (sp < 2) return;
        const n = Math.min(2, Math.ceil(sp / 15));
        for (let i = 0; i < n; i++) {
          parts.push({
            x: e.clientX + (Math.random() - 0.5) * 3,
            y: e.clientY + (Math.random() - 0.5) * 3,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -Math.random() * 0.5 - 0.1,
            life: 1,
            size: 0.9 + Math.random() * 1.6,
          });
        }
      });
      function tick() {
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.shadowColor = 'rgba(220,192,107,0.9)';
        ctx.shadowBlur = 5;
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.018;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
          ctx.fillStyle = `rgba(220,192,107,${p.life * 0.7})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.4 + p.life * 0.6), 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    // ─────────  2D renderer (lazy)  ─────────
    function nodeRadius2D(n) {
      // pagerank-weighted, coarser than 3D so top nodes stand out
      const base = Math.max(2.5, Math.cbrt(nodeVal(n)) * 1.2);
      if (focus && n.id === focus.id) return base * 1.9;
      if (hoverTarget && n.id === hoverTarget.id) return base * 1.35;
      return base;
    }
    function initG2() {
      if (G2) return;
      const el = document.getElementById('graph2d');
      G2 = ForceGraph()(el)
        .backgroundColor('rgba(0,0,0,0)')  // se ve el fondo + estrellas de #graph2d
        .nodeLabel(nodeTooltip)
        .nodeRelSize(1)
        .nodeVal(n => nodeRadius2D(n))
        .nodeColor(n => baseColor(n))
        .nodeCanvasObject((n, ctx) => {
          if (!Number.isFinite(n.x) || !Number.isFinite(n.y)) return;
          const r = nodeRadius2D(n), c = baseColor(n);
          ctx.save();
          const glow = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3.5);   // halo aditivo, como el sprite del 3D
          glow.addColorStop(0, c + '8c');
          glow.addColorStop(1, c + '00');
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r * 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = c;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          if (focus && n.id === focus.id) {
            ctx.strokeStyle = '#c8a84b';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        })
        .nodePointerAreaPaint((n, color, ctx) => {
          const r = Math.max(4, nodeRadius2D(n));
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
          ctx.fill();
        })
        .linkColor(linkColorFn)
        .linkWidth(linkWidthFn)
        .linkCanvasObjectMode(() => 'replace')
        .linkCanvasObject(drawLink2D)
        .linkPointerAreaPaint((l, color, ctx, scale) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 6 / scale;
          ctx.beginPath();
          ctx.moveTo(l.source.x, l.source.y);
          ctx.lineTo(l.target.x, l.target.y);
          ctx.stroke();
        })
        .linkLabel(linkLabelFn)
        .onNodeClick(n => focusNode(n))
        .onNodeHover(n => {
          hoverTarget = n || null;
          document.getElementById('graph2d').style.cursor = n ? 'pointer' : 'default';
        })
        .onLinkHover(l => {
          if (l && focus) {
            const s = l.source?.id ?? l.source, t = l.target?.id ?? l.target;
            hoverLink = (s === focus.id || t === focus.id) ? l : null;
          } else {
            hoverLink = null;
          }
          document.getElementById('graph2d').style.cursor = hoverLink ? 'pointer' : 'default';
          refreshLinks();
        })
        .d3AlphaDecay(0.04)
        .d3VelocityDecay(0.25)
        .cooldownTime(4000);
      // Repulsión acotada + gravedad leve: sin esto los nodos sin vínculos se van lejísimos del resto
      G2.d3Force('charge').strength(-120).distanceMax(250);
      let gNodes = [];
      const gravity = a => { for (const n of gNodes) { n.vx -= n.x * 0.04 * a; n.vy -= n.y * 0.04 * a; } };
      gravity.initialize = ns => { gNodes = ns; };
      G2.d3Force('gravity', gravity);
      G2.d3Force('link').distance(linkDistance);
      G2.d3Force('cluster', makeClusterForce());
      G2.d3Force('cooc', makeCoocForce());
    }

    function switchViewMode(m) {
      if (m === mode) return;
      mode = m;
      document.body.classList.toggle('mode-2d', m === '2d');
      document.getElementById('graph3d').style.display = m === '3d' ? '' : 'none';
      document.getElementById('graph2d').style.display = m === '2d' ? 'block' : 'none';
      if (m === '2d') initG2();
      document.querySelectorAll('.view-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.view === m);
      });
      // Push current state to newly-active instance (preserves preset, focus, ego)
      applyView();
      refreshNodeColors();
      activeG().d3ReheatSimulation();
      setTimeout(() => {
        if (focus) flyTo(focus, 800);
        else activeG().zoomToFit(800, 60);
      }, 500);
    }

    document.querySelectorAll('.view-btn').forEach(b => {
      b.addEventListener('click', () => switchViewMode(b.dataset.view));
    });

    buildLegend();
    load();
  </script>
